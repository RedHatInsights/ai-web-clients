name: CI

on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: './.github/actions/setup-environment'

      - name: Install dependencies
        run: npm ci

      - name: Test release tooling
        run: node --test ".github/scripts/*.test.cjs"

      - name: Run tests
        env:
           NX_TUI: false
        run: |-
          npm run dev:mock > /dev/null &
          sleep 5
          npx nx run-many --target=test --all --parallel=1

      - name: Run linting
        env:
           NX_TUI: false
        run: npx nx run-many --target=lint --all --parallel --maxParallel=4

      - name: Build packages
        env:
           NX_TUI: false
        run: npx nx run-many --target=build --all --parallel --maxParallel=4

  commitlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: './.github/actions/setup-environment'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test commitlint config
        run: NODE_OPTIONS="--experimental-vm-modules" npx jest --config=commitlint.jest.config.js
      - name: Validate current commit on push
        if: github.event_name == 'push'
        run: npx commitlint --from HEAD~1 --to HEAD --verbose
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
