name: CI

on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Test release tooling
        run: node --test ".github/scripts/*.test.cjs"

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          npx commitlint --from "$MERGE_BASE" --to "$HEAD_SHA" --verbose

      - name: Lint pull request title (squash merge subject)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

      - name: Run tests
        env:
           NX_TUI: false
        run: |-
          npm run dev:mock > /dev/null &
          sleep 5
          npx nx run-many --target=test --all --parallel=1

      - name: Run linting
        env:
           NX_TUI: false
        run: npx nx run-many --target=lint --all --parallel --maxParallel=4

      - name: Build packages
        env:
           NX_TUI: false
        run: npx nx run-many --target=build --all --parallel --maxParallel=4
