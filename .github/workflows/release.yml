name: Release

# Release order (never reorder):
#   verify baseline -> nx release (commit + tags, no publish) -> validate signed commit/tags
#   -> atomic git push of the release commit and new tags -> npm publish
# A rejected or racing push stops the job before anything reaches npm. See docs/release-operations.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish
    # Only the authoritative repository, only on push to main (never forks or workflow_dispatch).
    if: github.repository == 'RedHatInsights/ai-web-clients' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One release at a time. Never cancel a run that may already have pushed but not yet published.
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
      queue: max         # keep every queued run (up to 100), do not replace a pending one
    permissions:
      contents: read     # Git writes use the bot token below, not GITHUB_TOKEN
      id-token: write    # npm trusted publishing (OIDC) and provenance
    env:
      NX_TUI: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # The run may have waited in the release queue behind another release (or behind merges), so
      # catch up with main before anything is calculated. Every commit on main passed PR checks.
      - name: Confirm repository and catch up with main
        run: |
          .github/scripts/release-refs.sh check-origin RedHatInsights/ai-web-clients
          .github/scripts/release-refs.sh fast-forward origin main

      - name: Install dependencies
        run: npm ci

      - name: Configure signing identity
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GIT_USER_NAME: ${{ secrets.GH_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GH_EMAIL }}
        run: .github/scripts/release-refs.sh configure-signing

      - name: Verify versions are aligned before releasing
        run: .github/scripts/verify-versions.sh

      - name: Record baseline
        run: |
          {
            echo "BASE_SHA=$(git rev-parse HEAD)"
            echo "RELEASE_TAGS_BEFORE=$RUNNER_TEMP/tags-before.txt"
          } >> "$GITHUB_ENV"
          .github/scripts/release-refs.sh snapshot-tags "$RUNNER_TEMP/tags-before.txt"

      # Nx runs its pre-version build, bumps source and dist manifests, writes changelogs, makes one
      # signed commit and signed tags. Any failure fails the job. HUSKY=0: the release commit is
      # machine generated, so the commit-msg hook adds nothing.
      - name: Prepare release (version, changelog, commit, tags)
        env:
          HUSKY: 0
          npm_config_legacy_peer_deps: false
        run: npx nx release --skip-publish

      - name: Decide whether anything was released
        id: decide
        run: |
          result="$(.github/scripts/release-refs.sh release-state "$BASE_SHA" "$RELEASE_TAGS_BEFORE")"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "none" ]; then
            echo "::notice::No releasable changes. Nothing pushed, nothing published."
          fi

      - name: Validate signed release commit and tags
        if: steps.decide.outputs.result == 'release'
        run: |
          .github/scripts/release-refs.sh validate-release "$BASE_SHA" "$RELEASE_TAGS_BEFORE"
          {
            echo "### Release prepared"
            git tag --points-at HEAD | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push release commit and tags atomically
        if: steps.decide.outputs.result == 'release'
        run: .github/scripts/release-refs.sh push-release origin "$RELEASE_TAGS_BEFORE"

      - name: Publish to npm
        if: steps.decide.outputs.result == 'release'
        env:
          # No NODE_AUTH_TOKEN: npm auth via OIDC trusted publishing (id-token: write + npm-publish environment)
          NPM_CONFIG_PROVENANCE: true
          npm_config_legacy_peer_deps: false
        run: npx nx release publish
