name: Release

# Release order: CI -> strict baseline verification -> Nx preparation
# (pre-version build, versions, changelogs, one signed commit, signed tags) ->
# one atomic push -> npm publish. npm is written to only after GitHub has accepted
# the release commit and tags. See docs/release-operations.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish
    # Only run on push to main (never workflow_dispatch).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One release at a time. Never cancel a run that may already have pushed but not yet published.
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
      queue: max         # keep every queued run (up to 100), do not replace a pending one
    permissions:
      contents: read     # Git writes use the bot token below, not GITHUB_TOKEN
      id-token: write    # npm trusted publishing (OIDC) and provenance
    env:
      NX_TUI: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import

      - name: Configure Git identity and signing
        env:
          GIT_USER_NAME: ${{ secrets.GH_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GH_EMAIL }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git config commit.gpgsign true
          git config tag.gpgsign true
          git config user.signingkey "$(gpg --list-secret-keys --with-colons "$GIT_USER_EMAIL" | awk -F: '/^sec:/ {print $5; exit}')"

      - name: Verify versions are aligned before releasing
        run: .github/scripts/verify-versions.sh

      # Nx runs its pre-version build, bumps source and dist manifests from conventional
      # commits, updates changelogs and the lockfile, then creates one signed commit and one
      # signed annotated tag per released project. HUSKY=0: the release commit is machine
      # generated, so the commit-msg hook adds nothing.
      - name: Prepare release (version, changelog, commit, tags)
        env:
          HUSKY: 0
          npm_config_legacy_peer_deps: false
        run: npx nx release --skip-publish

      # nx release creates the release commit and tags locally. Treat that commit as
      # immutable: rebasing it can leave signed tags pointing at its old hash. If main
      # advanced during release calculation, this atomic push fails and the attempt must be
      # restarted from main. --follow-tags pushes annotated release tags; --atomic prevents
      # a commit-only push.
      - name: Push release commit and tags
        env:
          HUSKY: '0'
        run: git push --atomic --follow-tags origin HEAD:main

      # Publish only after the push succeeds, from the already-versioned workspace.
      - name: Publish to npm
        env:
          # No NODE_AUTH_TOKEN: npm auth via OIDC trusted publishing (id-token: write + npm-publish environment)
          NPM_CONFIG_PROVENANCE: true
          npm_config_legacy_peer_deps: false
        run: npx nx release publish
